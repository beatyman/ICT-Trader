[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ict-trader"
version = "0.1.0"
description = "Reproducible ICT/SMC analysis, frozen setup and event-driven backtest"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "beatyman" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
futu = ["futu-api>=9.0"]
realtime = [
  "clickhouse-connect>=0.8",
  "fastapi>=0.110",
  "httpx>=0.27",
  "orjson>=3.9",
  "redis>=5.0",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
]
dev = ["pytest>=7.0"]
all = [
  "ict-trader[realtime,dev]",
]

[project.scripts]
ict-trader = "ict_trader.cli:main"
ict-realtime = "ict_trader.realtime.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ict_trader.realtime" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
