[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ict-trader"
version = "0.1.0"
description = "Reproducible ICT/SMC analysis, frozen setup and event-driven backtest"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "beatyman" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
futu = ["futu-api>=9.0"]
dev = ["pytest>=7.0"]

[project.scripts]
ict-trader = "ict_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
