name: ict-realtime

# Local stand-in for the Tokyo VPS prototype:
#   Redis  -> realtime cache / indexes
#   ClickHouse -> immutable closed-bar store
#
# Default `docker compose up -d` starts only the two middleware services.
# `docker compose --profile app up -d --build` also runs the paper-trading app.
services:
  redis:
    image: redis:7-alpine
    container_name: ict-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    mem_limit: 512m
    mem_reservation: 128m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [ict-net]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: ict-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: ict
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/config.d/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      - ./deploy/clickhouse/users.d/limits.xml:/etc/clickhouse-server/users.d/limits.xml:ro
    mem_limit: 2g
    mem_reservation: 512m
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
      nproc:
        soft: 4096
        hard: 4096
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks: [ict-net]

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ict-app
    restart: unless-stopped
    command: ["python", "-m", "ict_trader.realtime", "--mode", "live", "--host", "0.0.0.0", "--port", "8080"]
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1200m
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks: [ict-net]

volumes:
  redis-data:
  clickhouse-data:

networks:
  ict-net:
    driver: bridge
