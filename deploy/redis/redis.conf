# Realtime K-line cache. Redis is a cache + closed-bar index, not the system of
# record: ClickHouse owns immutable closed bars and the app owns a SQLite WAL.
# Docker Desktop's host->container NAT makes app traffic appear non-loopback,
# so protected-mode must be off. The published port is bound to 127.0.0.1 only
# and this network is not exposed beyond the local machine.
bind 0.0.0.0
protected-mode no
port 6379

# Keep headroom below the 512 MB container limit. noeviction is deliberate:
# silently evicting a `kline:latest:*` hash would corrupt consumers' view.
maxmemory 384mb
maxmemory-policy noeviction
maxmemory-samples 5

# Cache-first deployment: no RDB/AOF. Closed bars are already in ClickHouse and
# missed unclosed bars are re-fetched through REST after a restart.
save ""
appendonly no
stop-writes-on-bgsave-error no

tcp-keepalive 60
timeout 0
tcp-backlog 511
hz 20
loglevel notice
